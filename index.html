<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の新着まとめ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; display: flex; justify-content: space-between; }
  .section { background: #fff; border-radius: 12px; border: 1px solid #e8e8e8; margin-bottom: 16px; overflow: hidden; }
  .section-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #fafafa; border-bottom: 1px solid #e8e8e8; cursor: pointer; }
  .section-title { font-size: 15px; font-weight: 500; flex: 1; }
  .section-count { font-size: 12px; color: #aaa; }
  .accounts { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; }
  .account-btn { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; border: 1px solid #e0e0e0; background: transparent; cursor: pointer; font-size: 12px; color: #555; }
  .account-btn.active { border-color: #378ADD; background: #E6F1FB; color: #378ADD; }
  .account-input { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid #f0f0f0; }
  .account-input input { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid #e0e0e0; font-size: 12px; }
  .account-input button { padding: 6px 12px; border-radius: 8px; border: 1px solid #378ADD; background: #E6F1FB; color: #378ADD; font-size: 12px; cursor: pointer; }
  .post { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #fff; flex-shrink: 0; }
  .post-body { flex: 1; min-width: 0; }
  .post-meta { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .post-name { font-size: 13px; font-weight: 500; }
  .post-time { font-size: 12px; color: #aaa; }
  .post-text { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 6px; }
  .post-footer { display: flex; gap: 12px; align-items: center; }
  .post-stat { font-size: 12px; color: #aaa; }
  .post-link { font-size: 12px; color: #378ADD; text-decoration: none; margin-left: auto; }
  .empty { padding: 20px; text-align: center; font-size: 13px; color: #bbb; }
  .refresh-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #e0e0e0; background: #fff; font-size: 12px; cursor: pointer; color: #555; }
</style>
</head>
<body>
<div class="container">
  <h1>今日の新着まとめ</h1>
  <div class="subtitle">
    <span id="today-date"></span>
    <button class="refresh-btn" onclick="loadAll()">↻ 更新</button>
  </div>
  <div id="sections"></div>
</div>

<script>
const PROXY = "https://res-proxy.ayatakechiii.workers.dev/?url=";

const state = {
  youtube: {
    label: "YouTube",
    color: "#E24B4A",
    accounts: JSON.parse(localStorage.getItem("yt_accounts") || "[]"),
  },
  twitter: {
    label: "Twitter / X",
    color: "#1DA1F2",
    accounts: JSON.parse(localStorage.getItem("tw_accounts") || "[]"),
  },
};

function saveAccounts() {
  localStorage.setItem("yt_accounts", JSON.stringify(state.youtube.accounts));
  localStorage.setItem("tw_accounts", JSON.stringify(state.twitter.accounts));
}

function getYouTubeRSS(channelId) {
  return `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;
}

function getNitterRSS(username) {
  return `https://nitter.net/${username}/rss`;
}

async function fetchRSS(url) {
  const res = await fetch(PROXY + encodeURIComponent(url));
  const text = await res.text();
  const parser = new DOMParser();
  return parser.parseFromString(text, "application/xml");
}

async function loadYouTube(account) {
  try {
    const xml = await fetchRSS(getYouTubeRSS(account.id));
    const entries = xml.querySelectorAll("entry");
    return Array.from(entries).slice(0, 3).map(e => ({
      name: account.name,
      text: e.querySelector("title")?.textContent || "",
      time: e.querySelector("published")?.textContent?.slice(0, 10) || "",
      url: e.querySelector("link")?.getAttribute("href") || "#",
      views: "",
      color: state.youtube.color,
    }));
  } catch { return []; }
}

async function loadTwitter(account) {
  try {
    const xml = await fetchRSS(getNitterRSS(account.name.replace("@", "")));
    const items = xml.querySelectorAll("item");
    return Array.from(items).slice(0, 3).map(e => ({
      name: account.name,
      text: e.querySelector("title")?.textContent || "",
      time: e.querySelector("pubDate")?.textContent?.slice(0, 16) || "",
      url: e.querySelector("link")?.textContent || "#",
      color: state.twitter.color,
    }));
  } catch { return []; }
}

function initials(name) {
  return name.replace("@", "").slice(0, 2).toUpperCase();
}

function renderSection(platform) {
  const s = state[platform];
  const el = document.getElementById(`section-${platform}`);
  const postsEl = el.querySelector(".posts");
  postsEl.innerHTML = `<div class="empty">読み込み中...</div>`;

  const promises = s.accounts.filter(a => a.active).map(a =>
    platform === "youtube" ? loadYouTube(a) : loadTwitter(a)
  );

  Promise.all(promises).then(results => {
    const posts = results.flat();
    if (posts.length === 0) {
      postsEl.innerHTML = `<div class="empty">アカウントを追加・選択してください</div>`;
      return;
    }
    postsEl.innerHTML = posts.map(p => `
      <div class="post">
        <div class="avatar" style="background:${p.color}">${initials(p.name)}</div>
        <div class="post-body">
          <div class="post-meta">
            <span class="post-name">${p.name}</span>
            <span class="post-time">${p.time}</span>
          </div>
          <div class="post-text">${p.text.slice(0, 120)}${p.text.length > 120 ? "…" : ""}</div>
          <div class="post-footer">
            <a class="post-link" href="${p.url}" target="_blank">元の投稿 →</a>
          </div>
        </div>
      </div>
    `).join("");
  });
}

function renderAccountBtns(platform) {
  const s = state[platform];
  const el = document.getElementById(`accounts-${platform}`);
  el.innerHTML = s.accounts.map((a, i) => `
    <button class="account-btn ${a.active ? "active" : ""}"
      onclick="toggleAccount('${platform}', ${i})">${a.name}</button>
  `).join("") + `
    <button class="account-btn" onclick="removeAccount('${platform}')">− 削除</button>
  `;
}

function toggleAccount(platform, i) {
  state[platform].accounts[i].active = !state[platform].accounts[i].active;
  saveAccounts();
  renderAccountBtns(platform);
  renderSection(platform);
}

function removeAccount(platform) {
  const name = prompt("削除するアカウント名を入力:");
  if (!name) return;
  state[platform].accounts = state[platform].accounts.filter(a => a.name !== name);
  saveAccounts();
  renderAccountBtns(platform);
  renderSection(platform);
}

function addAccount(platform) {
  const input = document.getElementById(`input-${platform}`);
  const val = input.value.trim();
  if (!val) return;

  if (platform === "youtube") {
    const name = prompt("表示名を入力（例：Fireship）:");
    if (!name) return;
    state.youtube.accounts.push({ id: val, name, active: true });
  } else {
    const uname = val.startsWith("@") ? val : "@" + val;
    state.twitter.accounts.push({ name: uname, active: true });
  }
  input.value = "";
  saveAccounts();
  renderAccountBtns(platform);
  renderSection(platform);
}

function buildSections() {
  const container = document.getElementById("sections");
  container.innerHTML = Object.entries(state).map(([key, s]) => `
    <div class="section" id="section-${key}">
      <div class="section-header">
        <span class="section-title">${s.label}</span>
        <span class="section-count">${s.accounts.filter(a=>a.active).length} アカウント</span>
      </div>
      <div class="accounts" id="accounts-${key}"></div>
      <div class="account-input">
        <input id="input-${key}" placeholder="${key === "youtube" ? "チャンネルID（例：UCxxxxxx）" : "ユーザー名（例：elonmusk）"}" />
        <button onclick="addAccount('${key}')">追加</button>
      </div>
      <div class="posts"></div>
    </div>
  `).join("");
}

function loadAll() {
  Object.keys(state).forEach(p => {
    renderAccountBtns(p);
    renderSection(p);
  });
}

document.getElementById("today-date").textContent =
  new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });

buildSections();
loadAll();
</script>
</body>
</html>
